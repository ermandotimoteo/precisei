<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar serviço - Precisei</title>
    <link rel="stylesheet" th:href="@{/css/style.css}" href="/css/style.css">
</head>
<body>
    <header th:replace="~{fragments/navegacao :: cabecalho('servicos')}"></header>
    <main id="conteudo" class="pagina-formulario">
        <section class="cabecalho-pagina"><div><p class="rotulo">Catálogo</p><h2>Editar serviço</h2><p>Atualize as informações do serviço selecionado.</p></div></section>
        <section class="painel-formulario formulario-central">
            <form th:action="@{/servicos/{id}/editar(id=${servicoForm.id})}" th:object="${servicoForm}" method="post">
<div class="resumo-erros" th:if="${#fields.hasErrors()}" role="alert"><p>Revise os campos indicados:</p><ul><li th:each="erro : ${#fields.allErrors()}" th:text="${erro}"></li></ul></div>
                <div class="grade-campos">
                    <div class="campo"><label for="nome">Nome</label><input id="nome" th:field="*{nome}" maxlength="100" th:attr="aria-invalid=${#fields.hasErrors('nome')},aria-describedby='nome-erro'"><p class="erro" th:if="${#fields.hasErrors('nome')}" th:errors="*{nome}" id="nome-erro"></p></div>
                    <div class="campo"><label for="categoria">Categoria</label><select id="categoria" th:field="*{categoriaId}" th:attr="aria-invalid=${#fields.hasErrors('categoriaId')},aria-describedby='categoria-erro'"><option value="">Selecione</option><option th:each="categoria : ${categorias}" th:value="${categoria.id}" th:text="${categoria.nome}"></option></select><p class="erro" th:if="${#fields.hasErrors('categoriaId')}" th:errors="*{categoriaId}" id="categoria-erro"></p></div>
                    <div class="campo"><label for="preco">Preço de referência</label><input id="preco" type="number" th:field="*{precoReferencia}" min="0" step="0.01" th:attr="aria-invalid=${#fields.hasErrors('precoReferencia')},aria-describedby='preco-erro'"><p class="erro" th:if="${#fields.hasErrors('precoReferencia')}" th:errors="*{precoReferencia}" id="preco-erro"></p></div>
                    <div class="campo campo-largo"><label for="descricao">Descrição</label><textarea id="descricao" th:field="*{descricao}" maxlength="500" rows="4" th:attr="aria-invalid=${#fields.hasErrors('descricao')},aria-describedby='descricao-erro'"></textarea><p class="erro" th:if="${#fields.hasErrors('descricao')}" th:errors="*{descricao}" id="descricao-erro"></p></div>
                </div>
                <div class="acoes-formulario"><button class="botao" type="submit">Salvar alterações</button><a class="botao botao-secundario" th:href="@{/servicos}">Cancelar</a></div>
            </form>
        </section>
    </main>
    <footer th:replace="~{fragments/navegacao :: rodape}"></footer>
</body></html>
