# Nunca reutilizar o banco precisei. Sem URL externa, cria um MySQL descartável via Testcontainers.
spring.datasource.url=${TEST_DB_URL:jdbc:tc:mysql:8.0.46:///precisei_test?TC_DAEMON=true}
spring.datasource.username=${TEST_DB_USERNAME:test}
spring.datasource.password=${TEST_DB_PASSWORD:test}
spring.datasource.driver-class-name=${TEST_DB_DRIVER:org.testcontainers.jdbc.ContainerDatabaseDriver}
spring.flyway.baseline-on-migrate=false
spring.datasource.hikari.maximum-pool-size=6
app.security.bcrypt-strength=4
spring.jpa.show-sql=false
