<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar profissional - Precisei</title>
    <link rel="stylesheet" th:href="@{/css/style.css}" href="/css/style.css">
</head>
<body>
    <header th:replace="~{fragments/navegacao :: cabecalho('profissionais')}"></header>
    <main id="conteudo" class="pagina-formulario">
        <section class="cabecalho-pagina"><div><p class="rotulo">Perfil</p><h2>Editar profissional</h2><p>Atualize os dados e os serviços oferecidos.</p></div></section>
        <section class="painel-formulario formulario-central">
            <form th:action="@{/profissionais/{id}/editar(id=${profissionalForm.id})}" th:object="${profissionalForm}" method="post">
<div class="resumo-erros" th:if="${#fields.hasErrors()}" role="alert"><p>Revise os campos indicados:</p><ul><li th:each="erro : ${#fields.allErrors()}" th:text="${erro}"></li></ul></div>
                <div class="grade-campos">
                    <div class="campo"><label for="nome">Nome</label><input id="nome" th:field="*{nome}" maxlength="120" th:attr="aria-invalid=${#fields.hasErrors('nome')},aria-describedby='nome-erro'"><p class="erro" th:if="${#fields.hasErrors('nome')}" th:errors="*{nome}" id="nome-erro"></p></div>
                    <div class="campo"><label for="email">E-mail</label><input id="email" type="email" th:field="*{email}" maxlength="160" readonly th:attr="aria-invalid=${#fields.hasErrors('email')},aria-describedby='email-erro'"><p class="erro" th:if="${#fields.hasErrors('email')}" th:errors="*{email}" id="email-erro"></p></div>
                    <div class="campo"><label for="senha-atual">Senha atual (para alterar a senha)</label><input id="senha-atual" type="password" th:field="*{senhaAtual}" autocomplete="current-password"></div>
                    <div class="campo"><label for="telefone">Telefone</label><input id="telefone" th:field="*{telefone}" maxlength="20" th:attr="aria-invalid=${#fields.hasErrors('telefone')},aria-describedby='telefone-erro'"><p class="erro" th:if="${#fields.hasErrors('telefone')}" th:errors="*{telefone}" id="telefone-erro"></p></div>
                    <div class="campo"><label for="senha">Nova senha (opcional)</label><input id="senha" type="password" th:field="*{senha}" minlength="8" autocomplete="new-password" th:attr="aria-invalid=${#fields.hasErrors('senha')},aria-describedby='senha-erro'"><p class="erro" th:if="${#fields.hasErrors('senha')}" th:errors="*{senha}" id="senha-erro"></p></div>
                    <div class="campo"><label for="cidade">Cidade</label><input id="cidade" th:field="*{cidade}" maxlength="100" th:attr="aria-invalid=${#fields.hasErrors('cidade')},aria-describedby='cidade-erro'"><p class="erro" th:if="${#fields.hasErrors('cidade')}" th:errors="*{cidade}" id="cidade-erro"></p></div>
                    <div class="campo"><label for="bairro">Bairro</label><input id="bairro" th:field="*{bairro}" maxlength="100" th:attr="aria-invalid=${#fields.hasErrors('bairro')},aria-describedby='bairro-erro'"><p class="erro" th:if="${#fields.hasErrors('bairro')}" th:errors="*{bairro}" id="bairro-erro"></p></div>
                    <div class="campo campo-largo"><label for="descricao">Descrição</label><textarea id="descricao" th:field="*{descricao}" maxlength="1000" rows="3" th:attr="aria-invalid=${#fields.hasErrors('descricao')},aria-describedby='descricao-erro'"></textarea><p class="erro" th:if="${#fields.hasErrors('descricao')}" th:errors="*{descricao}" id="descricao-erro"></p></div>
                    <fieldset class="campo campo-largo grupo-opcoes"><legend>Serviços oferecidos</legend><label th:each="servico : ${servicos}"><input type="checkbox" th:field="*{servicoIds}" th:value="${servico.id}"><span th:text="${servico.nome}">Serviço</span></label><p class="erro" th:if="${#fields.hasErrors('servicoIds')}" th:errors="*{servicoIds}"></p></fieldset>
                    <label class="opcao-disponibilidade campo-largo"><input type="checkbox" th:field="*{disponivel}"> Disponível para novos atendimentos</label>
                </div>
                <div class="acoes-formulario"><button class="botao" type="submit">Salvar alterações</button><a class="botao botao-secundario" th:href="@{/profissionais}">Cancelar</a></div>
            </form>
        </section>
    </main>
    <footer th:replace="~{fragments/navegacao :: rodape}"></footer>
</body></html>
