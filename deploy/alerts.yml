groups:
  - name: precisei
    rules:
      - alert: PreciseiIndisponivel
        expr: up{job="precisei"} == 0
        for: 90s
        labels: {severity: critical}
        annotations: {summary: 'Aplicação sem coleta de métricas por 90 segundos'}
      - alert: PreciseiErrosHttp
        expr: >-
          (sum(rate(http_server_requests_seconds_count{job="precisei",status=~"5.."}[5m]))
          / clamp_min(sum(rate(http_server_requests_seconds_count{job="precisei"}[5m])), 0.001) > 0.05)
          and sum(increase(http_server_requests_seconds_count{job="precisei"}[5m])) >= 20
        for: 5m
        labels: {severity: high}
        annotations: {summary: 'Mais de 5% de erros HTTP com volume mínimo na janela'}
      - alert: PreciseiLatencia
        expr: histogram_quantile(0.95, sum by (le) (rate(http_server_requests_seconds_bucket{job="precisei"}[5m]))) > 2
        for: 5m
        labels: {severity: warning}
        annotations: {summary: 'p95 HTTP acima da meta provisória de 2 segundos'}
