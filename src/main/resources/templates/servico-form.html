<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar serviço - Precisei</title>
    <link rel="stylesheet" th:href="@{/css/style.css}" href="/css/style.css">
</head>
<body>
    <header class="cabecalho-site"><nav aria-label="Navegação principal"><a class="marca" th:href="@{/}" aria-label="Precisei - Página inicial"><span class="marca-icone" aria-hidden="true">P</span><h1>Precisei</h1></a><ul><li><a th:href="@{/}">Início</a></li><li><a th:href="@{/profissionais}">Profissionais</a></li><li><a th:href="@{/servicos}" aria-current="page">Serviços</a></li></ul></nav></header>
    <main class="pagina-formulario">
        <section class="cabecalho-pagina"><div><p class="rotulo">Catálogo</p><h2>Editar serviço</h2><p>Atualize as informações do serviço selecionado.</p></div></section>
        <section class="painel-formulario formulario-central">
            <form th:action="@{/servicos/{id}/editar(id=${servicoForm.id})}" th:object="${servicoForm}" method="post">
                <div class="grade-campos">
                    <div class="campo"><label for="nome">Nome</label><input id="nome" th:field="*{nome}" maxlength="100"><p class="erro" th:if="${#fields.hasErrors('nome')}" th:errors="*{nome}"></p></div>
                    <div class="campo"><label for="categoria">Categoria</label><select id="categoria" th:field="*{categoriaId}"><option value="">Selecione</option><option th:each="categoria : ${categorias}" th:value="${categoria.id}" th:text="${categoria.nome}"></option></select><p class="erro" th:if="${#fields.hasErrors('categoriaId')}" th:errors="*{categoriaId}"></p></div>
                    <div class="campo"><label for="preco">Preço de referência</label><input id="preco" type="number" th:field="*{precoReferencia}" min="0" step="0.01"><p class="erro" th:if="${#fields.hasErrors('precoReferencia')}" th:errors="*{precoReferencia}"></p></div>
                    <div class="campo campo-largo"><label for="descricao">Descrição</label><textarea id="descricao" th:field="*{descricao}" maxlength="500" rows="4"></textarea><p class="erro" th:if="${#fields.hasErrors('descricao')}" th:errors="*{descricao}"></p></div>
                </div>
                <div class="acoes-formulario"><button class="botao" type="submit">Salvar alterações</button><a class="botao botao-secundario" th:href="@{/servicos}">Cancelar</a></div>
            </form>
        </section>
    </main>
    <footer class="rodape-site"><p>© 2026 Precisei - Projeto Integrador de Tecnologia da Informação II</p></footer>
</body></html>
