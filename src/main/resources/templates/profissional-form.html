<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar profissional - Precisei</title>
    <link rel="stylesheet" th:href="@{/css/style.css}" href="/css/style.css">
</head>
<body>
    <header class="cabecalho-site"><nav aria-label="Navegação principal"><a class="marca" th:href="@{/}" aria-label="Precisei - Página inicial"><span class="marca-icone" aria-hidden="true">P</span><h1>Precisei</h1></a><ul><li><a th:href="@{/}">Início</a></li><li><a th:href="@{/profissionais}" aria-current="page">Profissionais</a></li><li><a th:href="@{/servicos}">Serviços</a></li><li><a th:href="@{/clientes}">Clientes</a></li><li><a th:href="@{/solicitacoes}">Solicitações</a></li></ul></nav></header>
    <main class="pagina-formulario">
        <section class="cabecalho-pagina"><div><p class="rotulo">Perfil</p><h2>Editar profissional</h2><p>Atualize os dados e os serviços oferecidos.</p></div></section>
        <section class="painel-formulario formulario-central">
            <form th:action="@{/profissionais/{id}/editar(id=${profissionalForm.id})}" th:object="${profissionalForm}" method="post">
                <div class="grade-campos">
                    <div class="campo"><label for="nome">Nome</label><input id="nome" th:field="*{nome}" maxlength="120"><p class="erro" th:if="${#fields.hasErrors('nome')}" th:errors="*{nome}"></p></div>
                    <div class="campo"><label for="email">E-mail</label><input id="email" type="email" th:field="*{email}" maxlength="160"><p class="erro" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></p></div>
                    <div class="campo"><label for="telefone">Telefone</label><input id="telefone" th:field="*{telefone}" maxlength="20"><p class="erro" th:if="${#fields.hasErrors('telefone')}" th:errors="*{telefone}"></p></div>
                    <div class="campo"><label for="senha">Nova senha (opcional)</label><input id="senha" type="password" th:field="*{senha}" minlength="8" autocomplete="new-password"><p class="erro" th:if="${#fields.hasErrors('senha')}" th:errors="*{senha}"></p></div>
                    <div class="campo"><label for="cidade">Cidade</label><input id="cidade" th:field="*{cidade}" maxlength="100"><p class="erro" th:if="${#fields.hasErrors('cidade')}" th:errors="*{cidade}"></p></div>
                    <div class="campo"><label for="bairro">Bairro</label><input id="bairro" th:field="*{bairro}" maxlength="100"><p class="erro" th:if="${#fields.hasErrors('bairro')}" th:errors="*{bairro}"></p></div>
                    <div class="campo campo-largo"><label for="descricao">Descrição</label><textarea id="descricao" th:field="*{descricao}" maxlength="1000" rows="3"></textarea><p class="erro" th:if="${#fields.hasErrors('descricao')}" th:errors="*{descricao}"></p></div>
                    <fieldset class="campo campo-largo grupo-opcoes"><legend>Serviços oferecidos</legend><label th:each="servico : ${servicos}"><input type="checkbox" th:field="*{servicoIds}" th:value="${servico.id}"><span th:text="${servico.nome}">Serviço</span></label><p class="erro" th:if="${#fields.hasErrors('servicoIds')}" th:errors="*{servicoIds}"></p></fieldset>
                    <label class="opcao-disponibilidade campo-largo"><input type="checkbox" th:field="*{disponivel}"> Disponível para novos atendimentos</label>
                </div>
                <div class="acoes-formulario"><button class="botao" type="submit">Salvar alterações</button><a class="botao botao-secundario" th:href="@{/profissionais}">Cancelar</a></div>
            </form>
        </section>
    </main>
    <footer class="rodape-site"><p>© 2026 Precisei - Projeto Integrador de Tecnologia da Informação II</p></footer>
</body></html>
